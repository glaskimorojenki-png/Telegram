name: Build Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Empty Telegram Keys & Configs
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "api_id=123456" >> local.properties
          echo "api_hash=abcdef1234567890abcdef1234567890" >> local.properties
          
          # Создаем обязательные пустые файлы, которые ищет Telegram при сборке
          mkdir -p TMessagesProj/src/main/assets
          touch TMessagesProj/src/main/assets/voip_build_vars.txt
          
          # Отключаем падения из-за отсутствия ключей Google Play
          echo "manifestmerger.enabled=true" >> local.properties

      - name: Build Official Telegram APK (Debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
